name: Test invalid type input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run devcard action with invalid type
        id: action
        uses: .
        with:
          user_id: "4uOGMHFMk"
          type: invalid
          dryrun: "true"
        continue-on-error: true
      - name: Assert action failed with invalid type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid type, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid type"
