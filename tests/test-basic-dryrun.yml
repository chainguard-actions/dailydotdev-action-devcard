name: Test basic dryrun usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          user_id: "test-user-id"
          dryrun: "true"
          commit_filename: devcard.png
          type: default
        continue-on-error: true
      - name: Assert action ran (dryrun mode - network may fail but action should start)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # In dryrun mode the action attempts to fetch the devcard from daily.dev.
          # Under act there is no real daily.dev user, so the action may fail with
          # a network/API error — that is acceptable. What we verify is that the
          # action was invoked (outcome is not empty) and that the user_id input
          # was accepted without a configuration error.
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome is empty — action was not invoked"
            exit 1
          fi
          echo "PASS: action was invoked with outcome=$OUTCOME"
