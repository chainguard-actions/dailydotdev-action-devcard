name: Test basic dryrun usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          user_id: "test-user-id"
          dryrun: "true"
          commit_filename: devcard.png
          type: default
        continue-on-error: true
      - name: Assert action ran (dryrun mode - no commit expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # In dryrun mode the action may succeed or fail depending on network
          # but it must have been invoked (outcome is not empty)
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not run (outcome is empty)"
            exit 1
          fi
          echo "PASS: action was invoked with user_id input, outcome=$OUTCOME"
