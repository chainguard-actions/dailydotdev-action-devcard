name: Test wide type dryrun usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run devcard action with wide type in dryrun mode
        id: action
        uses: .
        with:
          user_id: "4uOGMHFMk"
          type: wide
          dryrun: "true"
          commit_filename: devcard-wide.png
        continue-on-error: true
      - name: Assert action step ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action step ran with outcome: $OUTCOME"
