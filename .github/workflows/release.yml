name: release
run-name: "release '${{ github.event.inputs.version }}' version by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'major'
          - 'minor'
          - 'patch'

jobs:
  build:
    runs-on: ubuntu-20.04
    permissions:
      id-token: write # Enable OIDC
      pull-requests: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: chainguard-dev/actions/setup-gitsign@fabe4ed3f66ceb5f8ec86ed7ae6d0c945ca362fb # main

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Cache node_modules
        id: cache-node_modules
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-
            ${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node_modules.outputs.cache-hit != 'true'
        run: |
          pnpm install --frozen-lockfile

      - name: Setup git
        run: |
          git config --global tag.gpgsign true

      - name: Bump version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version "$INPUT_VERSION" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/$OLD_VERSION/$VERSION/g" README.md

      - name: Prune dist
        run: |
          rm -rf dist

      - name: Build
        run: |
          pnpm build
          git add -A dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "release: $VERSION" -a
          git push

          gh release create $VERSION --generate-notes
